<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCAtak | Enterprise Command</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
        
        /* Layout */
        #sidebar { width: 80px; background: var(--panel); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; z-index: 1000; }
        #workspace { flex: 1; position: relative; overflow: hidden; }
        .view-panel { position: absolute; inset: 0; display: none; padding: 20px; overflow-y: auto; }
        .view-panel.active { display: block; }

        /* Glass Cards */
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; }
        
        /* Map Controls */
        #map { width: 100%; height: 100%; }
        .toolbar { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 500; }
        .tool-btn { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div onclick="switchView('map')"><i class="fa-solid fa-map"></i></div>
        <div onclick="switchView('dash')"><i class="fa-solid fa-chart-pie"></i></div>
        <div onclick="switchView('chat')"><i class="fa-solid fa-comment"></i></div>
    </aside>

    <main id="workspace">
        <div id="view-map" class="view-panel active">
            <div id="map"></div>
            <div class="toolbar">
                <div class="tool-btn" onclick="toggleSat()"><i class="fa-solid fa-satellite"></i></div>
                <div class="tool-btn" onclick="locateMe()"><i class="fa-solid fa-location-crosshairs"></i></div>
            </div>
        </div>

        <div id="view-dash" class="view-panel">
            <h1 class="glass" style="padding:20px;">COMMAND DASHBOARD</h1>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <canvas id="unitChart" class="glass" style="padding:20px;"></canvas>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        // Init
        const map = L.map('map').setView([38.515, -76.513], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function switchView(view) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
        }

        // Feature: Satellite Toggle
        let sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        function toggleSat() {
            map.hasLayer(sat) ? map.removeLayer(sat) : map.addLayer(sat);
        }

        // Feature: Chart.js Integration
        const ctx = document.getElementById('unitChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Active', 'Idle', 'Offline'],
                datasets: [{ data: [12, 5, 2], backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444'] }]
            }
        });

        function locateMe() {
            map.locate({setView: true, maxZoom: 16});
        }
    </script>
</body>
</html>
